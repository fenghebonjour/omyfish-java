networks:
  omyfish-net:
    driver: bridge
  # Created by ../omyfish-ai's compose — start that stack first:
  #   cd ../omyfish-ai && docker compose up -d
  omyfish-shared:
    external: true

volumes:
  postgres_data:
  postgres_replica_data:
  mongo_data:
  rabbitmq_data:
  kafka_data:
  minio_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: omyfish
      POSTGRES_USER: omyfish
      POSTGRES_PASSWORD: omyfish_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Lets postgres-replica's pg_basebackup connect — see the script's own comment.
      - ./infrastructure/postgres/primary-init/allow-replication.sh:/docker-entrypoint-initdb.d/allow-replication.sh:ro
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omyfish"]
      interval: 10s
      retries: 5

  # Streaming read replica for shop-service's product-catalog reads (ProductRepositoryAdapter,
  # routed via config/ReadWriteRoutingDataSource — writes, including the flash-sale stock
  # decrement, always stay on postgres). Hand-rolled via pg_basebackup rather than a managed
  # replica service or an operator like Patroni, since this is a demo stack, not production —
  # docs/architecture/FLASH_SALE_DEEP_DIVE.md spells out what a real deployment would use
  # instead. Because the Caffeine/Redis cache (config/ProductCache.java) already absorbs most
  # catalog-read traffic, this replica only ever sees cache-miss overflow — a real outage here
  # only matters for requests that were already going to miss the cache.
  postgres-replica:
    image: postgis/postgis:16-3.4-alpine
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: postgres
      POSTGRES_USER: omyfish
      POSTGRES_PASSWORD: omyfish_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    networks: [omyfish-net]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omyfish"]
      interval: 10s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: omyfish
      MONGO_INITDB_ROOT_PASSWORD: omyfish_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: omyfish
      RABBITMQ_DEFAULT_PASS: omyfish_dev
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      retries: 5

  # Single-broker KRaft-mode Kafka (no ZooKeeper) — additive alongside rabbitmq above, scoped
  # only to shop-service's new OrderPlacedEvent stream (omyfish.shop.orders topic). The existing
  # omyfish.species/omyfish.observations RabbitMQ exchanges are untouched; this is not a
  # RabbitMQ replacement (docs/architecture/FLASH_SALE_DEEP_DIVE.md explains why Kafka was
  # chosen for this one mechanism: per-SKU partition ordering + replay for the audit ledger).
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omyfish
      MINIO_ROOT_PASSWORD: omyfish_dev
    ports:
      - "9000:9000"
      - "9001:9001"   # console
    volumes:
      - minio_data:/data
    networks: [omyfish-net]

  # Single instance, not a cluster — shop-service's L2 product-catalog cache
  # (services/shop-service/.../config/ProductCache.java). A real Redis Cluster/Sentinel would
  # be over-engineering for this demo's 10-SKU catalog; this is a documented scope boundary,
  # not an oversight (docs/architecture/FLASH_SALE_DEEP_DIVE.md).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [omyfish-net]

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    networks: [omyfish-net]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # UI
      - "14250:14250"   # gRPC collector
    networks: [omyfish-net]

  # ─── AI Service (Python) ───────────────────────────────────────────────────
  # Default: NOT started. The shared instance runs from ../omyfish-ai's own
  # compose on the omyfish-shared network. For a self-contained demo without
  # the external instance, run: docker compose --profile bundled up -d
  # (conflicts with the external instance on host port 8000 — run only one).

  ai-service:
    profiles: [bundled]
    build:
      context: ../omyfish-ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /checkpoints/best.pt
      CLASSES_PATH: /checkpoints/classes.json
      METADATA_PATH: /metadata/fish_info.json
    volumes:
      - ../omyfish-python/checkpoints:/checkpoints:ro
      - ../omyfish-python/data/metadata:/metadata:ro
    networks: [omyfish-net]

  # ─── Java Microservices ────────────────────────────────────────────────────

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omyfish
      SPRING_DATASOURCE_USERNAME: omyfish
      SPRING_DATASOURCE_PASSWORD: omyfish_dev
      JWT_SECRET: dev-secret-change-in-production-32b
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:14250
    depends_on:
      postgres: { condition: service_healthy }
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 40s

  species-service:
    build:
      context: .
      dockerfile: services/species-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://omyfish:omyfish_dev@mongodb:27017/omyfish?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: omyfish
      SPRING_RABBITMQ_PASSWORD: omyfish_dev
      OMYFISH_AI_SERVICE_URL: http://ai-service:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:14250
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: omyfish
      MINIO_SECRET_KEY: omyfish_dev
      SPECIES_METADATA_PATH: /metadata/fish_info.json
    volumes:
      - ../omyfish-python/data/metadata:/metadata:ro
    depends_on:
      mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_started }
    networks: [omyfish-net, omyfish-shared]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 40s

  observation-service:
    build:
      context: .
      dockerfile: services/observation-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omyfish
      SPRING_DATASOURCE_USERNAME: omyfish
      SPRING_DATASOURCE_PASSWORD: omyfish_dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: omyfish
      SPRING_RABBITMQ_PASSWORD: omyfish_dev
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: omyfish
      MINIO_SECRET_KEY: omyfish_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:14250
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 40s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omyfish
      SPRING_DATASOURCE_USERNAME: omyfish
      SPRING_DATASOURCE_PASSWORD: omyfish_dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: omyfish
      SPRING_RABBITMQ_PASSWORD: omyfish_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 40s

  shop-service:
    build:
      context: .
      dockerfile: services/shop-service/Dockerfile
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omyfish
      SPRING_DATASOURCE_USERNAME: omyfish
      SPRING_DATASOURCE_PASSWORD: omyfish_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:14250
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: omyfish
      MINIO_SECRET_KEY: omyfish_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_REPLICA_URL: jdbc:postgresql://postgres-replica:5432/omyfish
      SPRING_DATASOURCE_REPLICA_USERNAME: omyfish
      SPRING_DATASOURCE_REPLICA_PASSWORD: omyfish_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Off by default — set to "true" for a load-test run (Dockerfile's entrypoint reads this).
      JFR_ENABLED: ${JFR_ENABLED:-false}
    depends_on:
      postgres: { condition: service_healthy }
      postgres-replica: { condition: service_healthy }
      minio: { condition: service_started }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8080
      SPECIES_SERVICE_URL: http://species-service:8080
      OBSERVATION_SERVICE_URL: http://observation-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      SHOP_SERVICE_URL: http://shop-service:8080
      JWT_SECRET: dev-secret-change-in-production-32b
    depends_on:
      identity-service: { condition: service_healthy }
      species-service: { condition: service_healthy }
      observation-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      shop-service: { condition: service_healthy }
    networks: [omyfish-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 40s

  # ─── Frontend ─────────────────────────────────────────────────────────────

  # Extracted to its own repo/image so it can be shared, versioned, and
  # patched once for every omyfish-* backend instead of vendored per-repo —
  # see https://github.com/fenghebonjour/omyfish-frontend. NEXT_PUBLIC_API_URL
  # is baked in at that repo's build time (defaults to :8080, matching every
  # backend's gateway port), not settable here at runtime.
  frontend:
    image: ghcr.io/fenghebonjour/omyfish-frontend:54d4c7a
    ports:
      - "3000:3000"
    depends_on:
      api-gateway: { condition: service_healthy }
    networks: [omyfish-net]

  # Angular twin of the frontend above (same API, different framework) — off
  # by default, opt in with: docker compose --profile angular up -d frontend-angular.
  # Also extracted to its own repo/image — see
  # https://github.com/fenghebonjour/omyfish-frontend-angular.
  frontend-angular:
    profiles: [angular]
    image: ghcr.io/fenghebonjour/omyfish-frontend-angular:20228cb
    ports:
      - "4200:80"
    depends_on:
      api-gateway: { condition: service_healthy }
    networks: [omyfish-net]
