name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly run on main — catches dependency drift even when no code changes.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test all modules
        run: mvn --batch-mode --errors --fail-at-end test

  # Testcontainers-backed *IT tests (real Postgres/RabbitMQ) — kept in their own job so a slow
  # or flaky container start doesn't block the fast unit-test signal above. ubuntu-latest already
  # runs a real Docker daemon, no dind/socket setup needed (WEAKNESS_AUDIT.md §4 — the
  # `integration-tests` Maven profile this activates didn't exist before this fix).
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Testcontainers-backed integration tests
        run: mvn --batch-mode --errors --fail-at-end verify -Pintegration-tests
