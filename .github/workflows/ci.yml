name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly run on main — catches dependency drift even when no code changes.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test all modules
        run: mvn --batch-mode --errors --fail-at-end test

  # Testcontainers-backed *IT tests (real Postgres/RabbitMQ) — kept in their own job so a slow
  # or flaky container start doesn't block the fast unit-test signal above. ubuntu-latest already
  # runs a real Docker daemon, no dind/socket setup needed (WEAKNESS_AUDIT.md §4 — the
  # `integration-tests` Maven profile this activates didn't exist before this fix).
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pin docker-java's API version
        # docker-java's version auto-negotiation probes with a stale default API
        # version that this runner's Docker daemon rejects ("client version 1.32 is
        # too old. Minimum supported API version is 1.40"). docker-java doesn't read
        # DOCKER_API_VERSION from the environment for this; it reads api.version from
        # $HOME/.docker-java.properties, so pin it there to skip the broken probe.
        run: echo "api.version=1.40" > "$HOME/.docker-java.properties"

      - name: Run Testcontainers-backed integration tests
        run: mvn --batch-mode --errors --fail-at-end verify -Pintegration-tests
