<div class="border rounded-xl p-3 flex flex-col gap-1">
  <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Daily Limit</p>
  @if (loading()) {
    <p class="text-sm text-gray-400">Loading…</p>
  } @else if (limits()?.rules?.[0]; as rule) {
    <p class="text-sm font-semibold text-gray-900">{{ rule.catchLimit }}</p>
    @if (rule.lengthLimit) {
      <p class="text-xs text-gray-500">{{ rule.lengthLimit }}</p>
    }
    <p class="text-xs text-gray-400">{{ limits()?.zoneName }}</p>
  } @else {
    <p class="text-sm text-gray-400">No data found</p>
  }
</div>
