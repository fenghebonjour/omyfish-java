<div class="border rounded-xl p-3 flex flex-col gap-1">
  <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Safe to Eat</p>
  @if (loading()) {
    <p class="text-sm text-gray-400">Loading…</p>
  } @else if (consumption()?.mealsPerMonth != null) {
    <p class="text-sm font-semibold text-gray-900">{{ consumption()!.mealsPerMonth }} meals/month</p>
    <p class="text-xs text-gray-400">{{ consumption()!.distanceKm.toFixed(0) }} km away</p>
  } @else {
    <p class="text-sm text-gray-400">No data found</p>
  }
</div>
