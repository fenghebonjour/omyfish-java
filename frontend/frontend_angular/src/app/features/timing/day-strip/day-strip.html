<div class="flex gap-1.5">
  <!-- @for requires a track expression (no implicit array index key like
       React's `key={day}`) — `track day` here since ISO date strings are
       already unique, same value React used as its `key`. -->
  @for (day of days(); track day; let i = $index) {
    <button
      (click)="select.emit(day)"
      class="flex-1 flex flex-col items-center rounded-xl py-2 text-sm transition-colors"
      [class]="selected() === day
        ? 'bg-blue-600 text-white'
        : 'bg-white text-gray-600 hover:bg-blue-50 border border-gray-100'"
    >
      <span class="text-xs" [class]="selected() === day ? 'text-blue-100' : 'text-gray-400'">
        {{ i === 0 ? 'Today' : weekday(dateOf(day)) }}
      </span>
      <span class="font-semibold">{{ dateOf(day).getDate() }}</span>
      <span class="text-[11px] font-medium" [class]="selected() === day ? 'text-white' : 'text-blue-600'">
        {{ roundScore(day) }}
      </span>
    </button>
  }
</div>
