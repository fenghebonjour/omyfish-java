<div class="fixed inset-0 z-10" (click)="close.emit()"></div>
<div class="absolute right-0 top-10 z-20 bg-white border border-blue-100 rounded-2xl shadow-lg p-4 w-[26rem] max-w-[90vw]">
  <p class="text-sm font-semibold text-gray-700 mb-3">Next 14 days</p>
  <div class="grid grid-cols-7 gap-1.5">
    @for (day of days(); track day) {
      <button
        (click)="pick(day)"
        class="flex flex-col items-center rounded-xl py-2"
        [class]="selected() === day ? 'bg-blue-600 text-white' : 'bg-blue-50/60 text-gray-700 hover:bg-blue-100'"
      >
        <span class="text-[10px]" [class]="selected() === day ? 'text-blue-100' : 'text-gray-400'">
          {{ dateOf(day).toLocaleDateString(undefined, { weekday: 'short' }) }}
        </span>
        <span class="text-sm font-semibold">{{ dateOf(day).getDate() }}</span>
        <span class="text-[11px] font-medium" [class]="selected() === day ? 'text-white' : 'text-blue-600'">
          {{ roundScore(day) }}
        </span>
      </button>
    }
  </div>
</div>
