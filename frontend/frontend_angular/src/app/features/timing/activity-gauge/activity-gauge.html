<div class="flex flex-col items-center gap-2">
  <svg width="160" height="160" viewBox="0 0 160 160">
    <circle cx="80" cy="80" [attr.r]="radius" fill="none" stroke="#dbeafe" stroke-width="12" />
    <circle
      cx="80"
      cy="80"
      [attr.r]="radius"
      fill="none"
      stroke="#2563eb"
      stroke-width="12"
      stroke-linecap="round"
      [attr.stroke-dasharray]="dashArray()"
      transform="rotate(-90 80 80)"
    />
    <text x="80" y="78" text-anchor="middle" class="fill-gray-900" font-size="36" font-weight="700">
      {{ displayScore() }}
    </text>
    <text x="80" y="100" text-anchor="middle" class="fill-gray-400" font-size="13">/ 100</text>
  </svg>
  <p class="text-sm font-medium text-blue-700">{{ label() }}</p>
</div>
