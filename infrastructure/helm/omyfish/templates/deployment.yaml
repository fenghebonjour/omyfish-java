{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
    {{- include "omyfish.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: omyfish
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: {{ $svc.port | quote }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Matches the non-root USER app (uid/gid 1001) baked into every Java service's and
      the frontend's Dockerfile — a container breakout or dependency RCE would otherwise have
      full root inside the pod for no benefit (BACKLOG.md item G, WEAKNESS_AUDIT.md §1.4).
      Excludes ai-service: it's built from the separate ../omyfish-ai repo, whose Dockerfile
      has no non-root user today — forcing runAsUser here without verifying/fixing that image
      first would just break its pod. */ -}}
      {{- if ne $name "ai-service" }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ if $.Values.global.imageRegistry }}{{ $.Values.global.imageRegistry }}/{{ end }}{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          {{- if ne $name "ai-service" }}
          securityContext:
            allowPrivilegeEscalation: false
          {{- end }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- if $svc.env }}
          env:
            {{- toYaml $svc.env | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: omyfish-config
            - secretRef:
                name: omyfish-secret
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          readinessProbe:
            {{- if $svc.readinessProbe }}
            {{- toYaml $svc.readinessProbe | nindent 12 }}
            {{- else }}
            {{- include "omyfish.defaultReadinessProbe" $ | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- if $svc.livenessProbe }}
            {{- toYaml $svc.livenessProbe | nindent 12 }}
            {{- else }}
            {{- include "omyfish.defaultLivenessProbe" $ | nindent 12 }}
            {{- end }}
{{- end }}
{{- end }}
