spring:
  application:
    name: species-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://omyfish:omyfish_dev@localhost:27017/omyfish?authSource=admin}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:omyfish}
    password: ${SPRING_RABBITMQ_PASSWORD:omyfish_dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:omyfish}
  secret-key: ${MINIO_SECRET_KEY:omyfish_dev}
  bucket: fish-images

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: on-param

omyfish:
  species:
    metadata-path: ${SPECIES_METADATA_PATH:}
  ai-service:
    url: ${OMYFISH_AI_SERVICE_URL:http://localhost:8000}
  rabbitmq:
    exchanges:
      species: omyfish.species
    routing-keys:
      fish-identified: fish.identified

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
