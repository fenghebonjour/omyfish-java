spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omyfish}
    username: ${SPRING_DATASOURCE_USERNAME:omyfish}
    password: ${SPRING_DATASOURCE_PASSWORD:omyfish_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_identity

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-x32}
  expiration-ms: 86400000
  refresh-expiration-ms: 2592000000

# Payment processors — billing endpoints return 503 until at least one is configured.
# The default is used for new checkouts; the others are tried in declaration order if it
# isn't configured. Refunds/webhooks for an existing subscription always go back to
# whichever processor actually created it, regardless of this default.
payment:
  default-processor: ${PAYMENT_DEFAULT_PROCESSOR:stripe}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-monthly: ${STRIPE_PRICE_MONTHLY:}   # 5 CAD/month
  price-yearly: ${STRIPE_PRICE_YEARLY:}     # 29 CAD/year

paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  plan-monthly: ${PAYPAL_PLAN_MONTHLY:}
  plan-yearly: ${PAYPAL_PLAN_YEARLY:}
  return-url: ${PAYPAL_RETURN_URL:}
  cancel-url: ${PAYPAL_CANCEL_URL:}

adyen:
  api-key: ${ADYEN_API_KEY:}
  merchant-account: ${ADYEN_MERCHANT_ACCOUNT:}
  client-key: ${ADYEN_CLIENT_KEY:}
  hmac-key: ${ADYEN_HMAC_KEY:}
  environment: ${ADYEN_ENVIRONMENT:TEST}
  currency: ${ADYEN_CURRENCY:CAD}
  price-monthly-cents: ${ADYEN_PRICE_MONTHLY_CENTS:500}
  price-yearly-cents: ${ADYEN_PRICE_YEARLY_CENTS:2900}
  return-url: ${ADYEN_RETURN_URL:}

# Scheduled repair for BACKLOG item I.3 (a crash between a processor call succeeding and the
# local save persisting its id). Same work is also available on demand via
# POST /api/v1/admin/subscriptions/reconcile.
reconciliation:
  interval-ms: ${RECONCILIATION_INTERVAL_MS:1800000}   # 30 min
  lookback-hours: ${RECONCILIATION_LOOKBACK_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
