# Source of truth for which route prefixes must NOT require a JWT at the gateway. A valid
# Bearer token is still parsed and forwarded as X-User-Id/Email/Role when one is present on a
# public route (it's just not rejected when absent) — that's how shop-service tells an
# account checkout from a guest checkout on the same cart/checkout endpoints.
#
# api-gateway's AuthFilter.PUBLIC_PREFIXES must match this list exactly (enforced by
# api-gateway's PublicRoutesContractTest), and each owning service asserts its own actual
# @RequestMapping-registered endpoints against the same list (each service's own
# GatewayPublicRoutesContractTest) — neither side's test suite can see the other's code, so
# this file is what both sides validate against instead of each other (BACKLOG.md item D).
#
# Adding a new endpoint under one of these prefixes makes it public automatically (AuthFilter
# matches by String.startsWith, not path-segment boundaries) — the owning service's contract
# test will fail until its expected-public-paths list is updated, forcing a conscious review
# of whether that's actually intended.
publicPrefixes:
  - prefix: /api/v1/auth/
    service: identity-service
    reason: login/register/refresh/logout — can't require a token to get a token
  - prefix: /api/v1/species
    service: species-service
    reason: identify/bite-score/regs/catalog browsing are all anonymous-friendly features
  - prefix: /api/v1/observations/geojson
    service: observation-service
    reason: public map feed
  - prefix: /api/v1/billing/webhook
    service: identity-service
    reason: Stripe/PayPal/Adyen call this directly; signature-verified in the service, not JWT-gated
  - prefix: /api/v1/shop/products
    service: shop-service
    reason: catalog browsing is anonymous-friendly, like species
  - prefix: /api/v1/shop/webhook/stripe
    service: shop-service
    reason: Stripe calls this directly; signature-verified in the service, not JWT-gated
  - prefix: /api/v1/shop/cart
    service: shop-service
    reason: guest checkout — cart must work without an account; gateway still forwards identity when a valid token is present
  - prefix: /api/v1/shop/checkout
    service: shop-service
    reason: guest checkout — an anonymous buyer pays with a guestEmail instead of X-User-Id
  - prefix: /api/v1/shop/orders/lookup
    service: shop-service
    reason: guest order tracking by orderId+email, no account needed
